name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Force compatible zip4j
        run: |
          cat <<'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'net.lingala.zip4j:zip4j:2.9.1'
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -Xss8m
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Xss8m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/release/*.apk
